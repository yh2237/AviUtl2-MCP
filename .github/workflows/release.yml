name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v5
        with:
          repository: aviutl2/aviutl2_sdk_mirror
          path: build/aviutl2-sdk
      - name: Test Go server
        run: go test ./...
      - name: Vet Go server
        run: go vet ./...
      - name: Configure native bridge against latest SDK
        run: >-
          cmake -S plugin -B build/verify
          -DAVIUTL2_SDK_DIR="${{ github.workspace }}/build/aviutl2-sdk/include/aviutl2_sdk"
      - name: Build native bridge and tests
        run: cmake --build build/verify --config Release
      - name: Test native bridge
        run: ctest --test-dir build/verify -C Release --output-on-failure
      - name: Build au2pkg
        shell: pwsh
        run: >-
          ./scripts/package.ps1
          -Version ("${{ github.ref_name }}".TrimStart('v'))
          -AviUtl2SdkDir "${{ github.workspace }}/build/aviutl2-sdk/include/aviutl2_sdk"
      - name: Checksum
        shell: pwsh
        run: Get-FileHash dist/*.zip -Algorithm SHA256 | Format-List
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
